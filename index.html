<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  * { box-sizing: border-box; }

  .vv-root {
    font-family: 'IBM Plex Mono', monospace;
    background: #12121c;
    color: #e8e6f0;
    min-height: 100vh;
    padding: 20px 16px 40px;
  }

  .vv-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .vv-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.02em;
    color: #f4d35e;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .vv-title .vv-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ff5470;
    display: inline-block;
  }

  .vv-count {
    font-size: 11px;
    color: #8b89a3;
  }

  .vv-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #1a1a28;
    border: 1px solid #2c2c3f;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 20px;
  }

  .vv-form input {
    width: 100%;
    background: #12121c;
    border: 1px solid #2c2c3f;
    border-radius: 6px;
    color: #e8e6f0;
    padding: 10px 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    outline: none;
  }

  .vv-form input:focus {
    border-color: #f4d35e;
  }

  .vv-form input::placeholder {
    color: #55536b;
  }

  .vv-row {
    display: flex;
    gap: 8px;
  }

  .vv-row input {
    flex: 1;
  }

  .vv-add-btn {
    background: #f4d35e;
    color: #12121c;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }

  .vv-add-btn:active {
    transform: scale(0.97);
  }

  .vv-error {
    font-size: 12px;
    color: #ff5470;
    display: none;
  }

  .vv-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .vv-card {
    background: #1a1a28;
    border: 1px solid #2c2c3f;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transition: border-color 0.15s ease;
  }

  .vv-card:active {
    transform: scale(0.98);
  }

  .vv-thumb-wrap {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #0d0d15;
    position: relative;
    overflow: hidden;
  }

  .vv-thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .vv-play {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .vv-play svg {
    width: 28px;
    height: 28px;
    filter: drop-shadow(0 1px 4px rgba(0,0,0,0.6));
  }

  .vv-card-body {
    padding: 8px 10px 10px;
  }

  .vv-card-title {
    font-size: 12px;
    color: #e8e6f0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }

  .vv-card-domain {
    font-size: 10px;
    color: #6f6d87;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .vv-delete {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(18,18,28,0.85);
    border: 1px solid #2c2c3f;
    color: #ff5470;
    font-size: 13px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .vv-empty {
    text-align: center;
    padding: 40px 16px;
    color: #6f6d87;
    font-size: 13px;
    grid-column: 1 / -1;
  }

  .vv-hint {
    font-size: 11px;
    color: #55536b;
    margin-top: 14px;
    text-align: center;
    line-height: 1.6;
  }

  .vv-loading {
    text-align: center;
    padding: 30px;
    color: #6f6d87;
    font-size: 12px;
    grid-column: 1 / -1;
  }
</style>

<div class="vv-root">
  <div class="vv-header">
    <div class="vv-title"><span class="vv-dot"></span>video vault</div>
    <div class="vv-count" id="vv-count">0 saved</div>
  </div>

  <div class="vv-form">
    <div class="vv-row">
      <input type="text" id="vv-url" placeholder="Paste video link (YouTube, etc.)" />
    </div>
    <div class="vv-row">
      <input type="text" id="vv-title-input" placeholder="Name (optional)" />
    </div>
    <div class="vv-row">
      <input type="text" id="vv-thumb-input" placeholder="Custom thumbnail URL (optional)" />
      <button class="vv-add-btn" id="vv-add-btn">+ add</button>
    </div>
    <div class="vv-error" id="vv-error">Enter a valid link first.</div>
  </div>

  <div class="vv-grid" id="vv-grid">
    <div class="vv-loading" id="vv-loading">loading...</div>
  </div>

  <div class="vv-hint">tap a card to open the video &middot; tap the link icon on your browser menu and choose "add to home screen" to install this as an app</div>
</div>

<script>
(function() {
  var STORE_KEY = 'vv-videos';
  var videos = [];
  var grid = document.getElementById('vv-grid');
  var countEl = document.getElementById('vv-count');
  var urlInput = document.getElementById('vv-url');
  var titleInput = document.getElementById('vv-title-input');
  var thumbInput = document.getElementById('vv-thumb-input');
  var addBtn = document.getElementById('vv-add-btn');
  var errorEl = document.getElementById('vv-error');

  function escapeHtml(str) {
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function getYouTubeId(url) {
    var m = url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  function getDomain(url) {
    try {
      var u = new URL(url);
      return u.hostname.replace(/^www\./, '');
    } catch (e) {
      return url;
    }
  }

  function deriveThumbnail(url, customThumb) {
    if (customThumb) return customThumb;
    var yt = getYouTubeId(url);
    if (yt) return 'https://img.youtube.com/vi/' + yt + '/hqdefault.jpg';
    var domain = getDomain(url);
    return 'https://www.google.com/s2/favicons?domain=' + domain + '&sz=128';
  }

  function normalizeUrl(url) {
    url = url.trim();
    if (!/^https?:\/\//i.test(url)) {
      url = 'https://' + url;
    }
    return url;
  }

  function isValidUrl(url) {
    try {
      new URL(url);
      return true;
    } catch (e) {
      return false;
    }
  }

  async function loadVideos() {
    try {
      var result = await window.storage.get(STORE_KEY, false);
      videos = result && result.value ? JSON.parse(result.value) : [];
    } catch (e) {
      videos = [];
    }
    render();
  }

  async function saveVideos() {
    try {
      await window.storage.set(STORE_KEY, JSON.stringify(videos), false);
    } catch (e) {
      console.error('Storage error:', e);
    }
  }

  function render() {
    countEl.textContent = videos.length + ' saved';

    if (videos.length === 0) {
      grid.innerHTML = '<div class="vv-empty">No videos yet.<br>Paste a link above to get started.</div>';
      return;
    }

    var html = '';
    for (var i = 0; i < videos.length; i++) {
      var v = videos[i];
      var domain = getDomain(v.url);
      var displayTitle = v.title || domain;
      html += '<div class="vv-card" data-index="' + i + '">' +
        '<div class="vv-delete" data-index="' + i + '">&times;</div>' +
        '<div class="vv-thumb-wrap">' +
          '<img src="' + escapeHtml(v.thumbnail) + '" alt="" onerror="this.src=\'https://www.google.com/s2/favicons?domain=' + escapeHtml(domain) + '&sz=128\'" />' +
          '<div class="vv-play"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="rgba(0,0,0,0.45)"/><path d="M19 15 L34 24 L19 33 Z" fill="white"/></svg></div>' +
        '</div>' +
        '<div class="vv-card-body">' +
          '<div class="vv-card-title">' + escapeHtml(displayTitle) + '</div>' +
          '<div class="vv-card-domain">' + escapeHtml(domain) + '</div>' +
        '</div>' +
      '</div>';
    }
    grid.innerHTML = html;

    var cards = grid.querySelectorAll('.vv-card');
    for (var j = 0; j < cards.length; j++) {
      cards[j].addEventListener('click', function(e) {
        if (e.target.classList.contains('vv-delete')) return;
        var idx = parseInt(this.getAttribute('data-index'), 10);
        window.open(videos[idx].url, '_blank');
      });
    }

    var deletes = grid.querySelectorAll('.vv-delete');
    for (var k = 0; k < deletes.length; k++) {
      deletes[k].addEventListener('click', async function(e) {
        e.stopPropagation();
        var idx = parseInt(this.getAttribute('data-index'), 10);
        videos.splice(idx, 1);
        render();
        await saveVideos();
      });
    }
  }

  addBtn.addEventListener('click', async function() {
    var rawUrl = urlInput.value.trim();
    if (!rawUrl) {
      errorEl.style.display = 'block';
      return;
    }
    var url = normalizeUrl(rawUrl);
    if (!isValidUrl(url)) {
      errorEl.style.display = 'block';
      return;
    }
    errorEl.style.display = 'none';

    var customThumb = thumbInput.value.trim();
    var thumbnail = deriveThumbnail(url, customThumb);
    var title = titleInput.value.trim();

    videos.unshift({ url: url, title: title, thumbnail: thumbnail });
    urlInput.value = '';
    titleInput.value = '';
    thumbInput.value = '';
    render();
    await saveVideos();
  });

  urlInput.addEventListener('input', function() {
    errorEl.style.display = 'none';
  });

  loadVideos();
})();
</script>
